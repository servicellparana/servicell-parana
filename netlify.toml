[build]
  command = "pnpm build"
  publish = "dist/client"
  environment = { NODE_VERSION = "22" }

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888
